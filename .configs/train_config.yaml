env:
  n_robots: 3
  n_boxes: 6
  tick_limit: 8000
  map_path: ".configs/map_factory.yaml"
  cache_path: ".configs/graph_cache.pkl"
  pipeline_path: ".configs/box_pipeline.yaml"

agent:
  hidden_dim: 128
  n_layers: 2
  dropout: 0.1
  device: "cpu"

train:
  n_episodes: 2000
  n_workers: 6
  lr: 0.0003
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef_start: 0.02
  entropy_coef_end: 0.005
  n_epochs: 4
  normalize_advantages: true
  max_grad_norm: 0.5

eval:
  every_n_episodes: 100
  n_eval_episodes: 5
  render: false

checkpoints:
  dir: "checkpoints"
  save_every: 100

wandb:
  project: "factory-rl-new"
  entity: null
  tags: []
  notes: "Novo env (SIPP + spawn em fila + prioridade)"
