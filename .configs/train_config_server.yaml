# train_config_server.yaml
# Optimizado para servidor: 4 cores, 8 GB RAM, sem GPU.

env:
  n_robots      : 4
  n_boxes       : 4
  tick_limit    : 3000
  map_path      : .configs/map_factory.yaml
  cache_path    : .configs/graph_cache.pkl
  pipeline_path : .configs/box_pipeline.yaml

agent:
  hidden_dim  : 128
  n_layers    : 2
  dropout     : 0.1
  device      : cpu          # sem GPU

train:
  n_workers         : 3      # 4 cores - 1 para o processo principal
  n_episodes        : 5000
  lr                : 1.0e-4
  gamma             : 0.99
  lam               : 0.95
  clip_eps          : 0.2
  value_coef        : 0.5
  entropy_coef_start: 0.05    # exploração inicial
  entropy_coef_end  : 0.01    # valor final
  n_epochs          : 1      # com n_workers=3 já tens 3x mais dados por update
  max_grad_norm     : 0.5
  normalize_advantages: true

eval:
  every_n_episodes  : 50
  n_eval_episodes   : 5
  render            : false  # sem display no servidor

checkpoints:
  dir               : checkpoints
  save_every        : 20     # mais frequente — crash = perdes menos

wandb:
  project           : factory-rl
  entity            : null
  tags              : ["server", "cpu"]
  notes             : "servidor 4c/8GB — sem GPU"
